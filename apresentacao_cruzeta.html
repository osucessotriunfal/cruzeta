<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Cruzeta de Duas Placas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Conceito: bancada de desenho. Folha quadriculada de engenharia, peças em tinta, lápis azul para o que é clicável. Visual único (papel), sem tema escuro, por escolha. */
:root{
  --papel:#eaefec; --grade:rgba(64,112,104,.11); --grade-forte:rgba(64,112,104,.22);
  --folha:#fbfcfa; --tinta:#1d262b; --tinta-2:#56646b; --lapis:#2350a0; --lapis-claro:#dfe7f5; --alerta:#b3372b;
  --f-tec:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-texto:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mao:"Kalam","Comic Sans MS","Segoe Print",cursive;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--tinta);font-family:var(--f-texto);font-size:15px;
  background:
   linear-gradient(var(--grade-forte) 1px,transparent 1px) 0 0/50px 50px,
   linear-gradient(90deg,var(--grade-forte) 1px,transparent 1px) 0 0/50px 50px,
   linear-gradient(var(--grade) 1px,transparent 1px) 0 0/10px 10px,
   linear-gradient(90deg,var(--grade) 1px,transparent 1px) 0 0/10px 10px,
   var(--papel);}
#app{position:fixed;inset:0}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px))}
.hud>*{pointer-events:auto}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;pointer-events:none}
.topo>*{pointer-events:auto}
.marca h1{font-family:var(--f-tec);font-weight:700;font-size:clamp(22px,3.2vw,34px);letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1}
.acoes-topo{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.marca p{margin:4px 0 0;font-family:var(--f-tec);font-size:15px;letter-spacing:.06em;color:var(--tinta-2);text-transform:uppercase}
.btn{font-family:var(--f-tec);font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
  border:1.5px solid var(--tinta);background:var(--folha);color:var(--tinta);padding:9px 16px;border-radius:3px;
  box-shadow:3px 3px 0 var(--tinta);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--tinta)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tinta)}
.btn:focus-visible{outline:2px dashed var(--lapis);outline-offset:3px}
.btn.pri{background:var(--lapis);color:#fff}
.btn.fant{box-shadow:none;border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:4px;padding-inline:6px}
.btn.fant:hover{transform:none;box-shadow:none;color:var(--lapis)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.meio{flex:1;display:flex;align-items:center;pointer-events:none}
.inventario{pointer-events:auto;background:rgba(251,252,250,.88);border:1.5px solid var(--tinta);border-radius:3px;padding:12px 14px;min-width:200px;box-shadow:3px 3px 0 var(--tinta)}
.inventario h2{font-family:var(--f-tec);font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px;color:var(--tinta-2)}
.inventario ol{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.inventario li{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;font-family:var(--f-tec);font-size:17px}
.inventario li .ck{width:14px;height:14px;border:1.5px solid var(--tinta);border-radius:2px;display:grid;place-items:center;font-size:12px;line-height:1}
.inventario li.ok .ck{background:var(--tinta);color:var(--folha)}
.inventario li.ok span.n{color:var(--tinta-2);text-decoration:line-through}
.inventario li.vez span.n{color:var(--lapis);font-weight:700}
.inventario li .q{color:var(--tinta-2);font-variant-numeric:tabular-nums}
.cartao{align-self:center;width:min(640px,100%);background:rgba(251,252,250,.95);border:1.5px solid var(--tinta);border-radius:3px;box-shadow:4px 4px 0 var(--tinta);padding:14px 18px 16px;display:grid;gap:8px}
.passos{display:flex;gap:4px}
.passos i{flex:1;height:5px;border:1px solid var(--tinta);border-radius:1px}
.passos i.ok{background:var(--tinta)}
.passos i.vez{background:var(--lapis);border-color:var(--lapis)}
.olho{font-family:var(--f-tec);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-2);display:flex;justify-content:space-between;gap:8px}
.cartao h3{margin:0;font-family:var(--f-tec);font-weight:700;font-size:26px;letter-spacing:.02em;text-wrap:balance}
.cartao p{margin:0;line-height:1.45;max-width:62ch;min-height:2.9em}
.acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.tag{position:absolute;left:0;top:0;pointer-events:none;transform:translate(-50%,-100%)}
.tag>span{display:block;font-family:var(--f-mao);font-size:17px;color:var(--tinta);white-space:nowrap;padding:0 6px;background:rgba(251,252,250,.75);border-bottom:1.5px solid var(--tinta);line-height:1.3}
.tag.alvo>span{color:var(--lapis);border-color:var(--lapis);font-weight:700;animation:pula 1s ease-in-out infinite}
.tag.nota>span{font-size:16px;background:rgba(251,252,250,.92);border:1.5px solid var(--lapis);color:var(--lapis);border-radius:2px;white-space:normal;width:max-content;max-width:220px}
.tag.clic>span{font-weight:700;color:var(--lapis);background:none;border:0;font-size:22px;animation:sobe 1.2s ease-out forwards}
.tag.treme>span{animation:treme .4s}
@keyframes pula{50%{transform:translateY(-5px)}}
@keyframes sobe{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-30px)}}
@keyframes treme{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#aviso{position:fixed;z-index:20;left:50%;top:84px;transform:translateX(-50%);font-family:var(--f-mao);font-size:19px;background:var(--folha);border:1.5px solid var(--alerta);color:var(--alerta);padding:4px 14px;border-radius:3px;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#legenda{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--f-mao);font-weight:700;font-size:clamp(20px,2.6vw,28px);color:var(--lapis);text-align:center;pointer-events:none;max-width:calc(100% - 32px);text-shadow:0 0 6px var(--papel),0 0 12px var(--papel)}
/* desenho técnico */
#desenho{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;background:inherit;
  background:
   linear-gradient(var(--grade-forte) 1px,transparent 1px) 0 0/50px 50px,
   linear-gradient(90deg,var(--grade-forte) 1px,transparent 1px) 0 0/50px 50px,
   linear-gradient(var(--grade) 1px,transparent 1px) 0 0/10px 10px,
   linear-gradient(90deg,var(--grade) 1px,transparent 1px) 0 0/10px 10px,
   var(--papel);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px))}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:10px}
.barra .dica{font-family:var(--f-tec);letter-spacing:.05em;color:var(--tinta-2);font-size:15px}
.mesa{flex:1;min-height:0;overflow:auto;display:grid;place-items:center}
.mesa svg{display:block;width:100%;height:100%;max-height:100%;background:var(--folha);box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 30px rgba(29,38,43,.18)}
.mesa.real{place-items:start}
.mesa.real svg{width:1800px;height:auto;max-height:none}

@media (max-width:760px){.inventario{display:none}.cartao h3{font-size:21px}.cartao{padding:12px 14px}.marca p{display:none}}
@media (prefers-reduced-motion:reduce){.tag.alvo>span{animation:none}.btn{transition:none}}
</style>

<div id="app">
  <canvas id="c3d" aria-label="Montagem 3D da cruzeta: arraste para girar, role para aproximar"></canvas>
  <div id="tags"></div>
  <div id="legenda" hidden></div>
  <div id="aviso" hidden></div>
  <div class="hud">
    <div class="topo">
      <div class="marca">
        <h1>Cruzeta de duas placas</h1>
        <p>Montagem interativa · Al 6351-T6 ou aço SAE 1020 · manípulos M8</p>
      </div>
      <div class="acoes-topo"><button class="btn" id="bBaixar3D" type="button">Baixar 3D (STL)</button><button class="btn" id="bDesenho" type="button">Desenho técnico ▸</button></div>
    </div>
    <div class="meio">
      <aside class="inventario" aria-label="Peças">
        <h2>Peças na bancada</h2>
        <ol id="inv"></ol>
      </aside>
    </div>
    <div class="cartao" role="region" aria-live="polite">
      <div class="passos" id="passos"></div>
      <div class="olho"><span id="eOlho">Etapa 1 de 7</span><span>Arraste para girar · role para aproximar</span></div>
      <h3 id="eTitulo">Tubo Ø25</h3>
      <p id="eTexto"></p>
      <div class="acoes">
        <button class="btn pri" id="bAcao" type="button">Montar</button>
        <button class="btn" id="bAuto" type="button">▶ Automático</button>
        <button class="btn fant" id="bReset" type="button">Recomeçar</button>
      </div>
    </div>
  </div>
</div>

<section id="desenho" hidden aria-label="Desenho técnico">
  <div class="barra">
    <button class="btn" id="bVoltar" type="button">◂ Voltar à montagem</button>
    <button class="btn" id="bZoom" type="button">Ampliar</button>
    <button class="btn pri" id="bPDF" type="button">Baixar PDF</button>
    <button class="btn" id="bPNG" type="button">PNG</button>
    <button class="btn" id="bSVG" type="button">SVG</button>
    <span class="dica">Folha A2 · escala 2:1 · medidas em mm</span>
  </div>
  <div class="mesa" id="mesa"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/OutlineEffect.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="pecas.js"></script>
<script>
(function(){
'use strict';
const D = window.PECAS;
const REDUZ = matchMedia('(prefers-reduced-motion: reduce)').matches;
const VEL = REDUZ ? 0.35 : 1;
const $ = s => document.querySelector(s);
const V3 = (x,y,z) => new THREE.Vector3(x,y,z);
const QI = new THREE.Quaternion();
const qDe = (x,y,z) => new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z));

// ================= GEOMETRIA (STL do autor, quantizado em 0,01 mm)
function lerPosicoes(nome){
  const bin = atob(D[nome]); const n = bin.length >> 1;
  const u8 = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  const i16 = new Int16Array(u8.buffer); const pos = new Float32Array(n);
  for(let i=0;i<n;i++) pos[i] = i16[i]/100;
  return {pos, i16};
}
// normais suavizadas só onde as faces fazem menos de "ang" graus (cilindros lisos, quinas vivas)
function normaisVincadas(pos, i16, ang){
  const nt = pos.length/9, fn = new Float32Array(nt*3);
  for(let t=0;t<nt;t++){
    const o=t*9;
    const ax=pos[o+3]-pos[o],ay=pos[o+4]-pos[o+1],az=pos[o+5]-pos[o+2];
    const bx=pos[o+6]-pos[o],by=pos[o+7]-pos[o+1],bz=pos[o+8]-pos[o+2];
    let x=ay*bz-az*by,y=az*bx-ax*bz,z=ax*by-ay*bx; const l=Math.hypot(x,y,z)||1;
    fn[t*3]=x/l; fn[t*3+1]=y/l; fn[t*3+2]=z/l;
  }
  const mapa = new Map();
  for(let c=0;c<nt*3;c++){
    const k = ((i16[c*3]+32768)*65536 + (i16[c*3+1]+32768))*65536 + (i16[c*3+2]+32768);
    let l = mapa.get(k); if(!l){ l=[]; mapa.set(k,l); } l.push(c);
  }
  const cos = Math.cos(ang*Math.PI/180), nor = new Float32Array(pos.length);
  mapa.forEach(l=>{
    for(const a of l){
      const ta=(a/3|0)*3; let sx=0,sy=0,sz=0;
      for(const b of l){ const tb=(b/3|0)*3;
        if(fn[ta]*fn[tb]+fn[ta+1]*fn[tb+1]+fn[ta+2]*fn[tb+2] >= cos){ sx+=fn[tb]; sy+=fn[tb+1]; sz+=fn[tb+2]; } }
      const l2=Math.hypot(sx,sy,sz)||1; nor[a*3]=sx/l2; nor[a*3+1]=sy/l2; nor[a*3+2]=sz/l2;
    }
  });
  return nor;
}
function geometria(nome, recentrar){
  const {pos,i16} = lerPosicoes(nome);
  const nor = normaisVincadas(pos,i16,32);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  let c = V3(0,0,0);
  if(recentrar){ g.computeBoundingBox(); g.boundingBox.getCenter(c); g.translate(-c.x,-c.y,-c.z); }
  return {g, c};
}

// ================= CENA
const canvas = $('#c3d');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000,0);
const efeito = new THREE.OutlineEffect(renderer,{defaultThickness:0.0032, defaultColor:[0.11,0.15,0.17], defaultAlpha:1});
const cena = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(34,1,1,5000);
const controles = new THREE.OrbitControls(cam, canvas);
controles.enableDamping = true; controles.dampingFactor = 0.09; controles.minDistance = 120; controles.maxDistance = 1400;
cena.add(new THREE.HemisphereLight(0xffffff,0x9aa4a8,0.55));
const sol = new THREE.DirectionalLight(0xffffff,0.75); sol.position.set(160,260,320); cena.add(sol);
const sol2 = new THREE.DirectionalLight(0xffffff,0.25); sol2.position.set(-200,-60,-150); cena.add(sol2);

const grad = new THREE.DataTexture(new Uint8Array([70,145,210,255]),4,1,THREE.LuminanceFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.generateMipmaps=false; grad.needsUpdate=true;
const COR_LAPIS = new THREE.Color(0x2350a0);

// grupo que gira e sobe no tubo (eixo do tubo em x=0, z=-23)
const pivo = new THREE.Group(); pivo.position.set(0,0,-23); cena.add(pivo);
const interno = new THREE.Group(); interno.position.set(0,0,23); pivo.add(interno);

const meshes = [];
function criarPeca(id, geoNome, cor, pai, recentrar, anguloAresta){
  const {g,c} = geometria(geoNome, recentrar);
  return montarObj(id, g, c, cor, pai, anguloAresta);
}
function montarObj(id, g, c, cor, pai, anguloAresta){
  const mat = new THREE.MeshToonMaterial({color:cor, gradientMap:grad, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1});
  const mesh = new THREE.Mesh(g, mat);
  const arestas = new THREE.LineSegments(new THREE.EdgesGeometry(g, anguloAresta), new THREE.LineBasicMaterial({color:0x1d262b}));
  const obj = new THREE.Group(); obj.add(mesh); obj.add(arestas); pai.add(obj);
  const p = {id, obj, mesh, mat, arestas, home:c.clone(), montado:false, corBase:new THREE.Color(cor)};
  mesh.userData.peca = p; meshes.push(mesh);
  return p;
}
const P = {};
P.tubo   = criarPeca('tubo','tubo',0xb9c1c6,cena,true,30);
P.placa1 = criarPeca('placa1','placa1',0xd3d9da,interno,true,30);
P.haste  = criarPeca('haste','haste',0xaab2b9,interno,true,30);
P.placa2 = criarPeca('placa2','placa2',0xd3d9da,interno,true,30);
const geoBorb = geometria('borb',false).g;
const EIXOS = [[22,22],[-22,22],[-22,-22],[22,-22]];
P.borbs = EIXOS.map((e,i)=>{ const b = montarObj('borb'+i, geoBorb, V3(e[0],e[1],0), 0x98a1a9, interno, 40); b.eixo=e; return b; });
const TODAS = [P.tubo,P.placa1,P.haste,P.placa2,...P.borbs];

// posições desmontadas (na bancada)
P.tubo.inicio   = {p:V3(-200,25,-40), q:qDe(0,0,0.22)};
P.placa1.inicio = {p:V3(-105,112,10),  q:qDe(0.55,0.45,0.1)};
P.haste.inicio  = {p:V3(150,120,-60), q:qDe(0,0.5,0.28)};
P.placa2.inicio = {p:V3(185,0,35),   q:qDe(0.25,-0.7,0.1)};
P.borbs.forEach((b,i)=>{ b.inicio = {p:V3(-95+i*62,-88,60), q:qDe(-1.15,0,i%2?0.45:-0.45)}; });
const NOMES = {tubo:'Tubo Ø25', placa1:'Placa #1', haste:'Haste Ø16,3', placa2:'Placa #2'};
P.borbs.forEach((b,i)=>NOMES[b.id]='Manípulo M8×60');
const TAG_OFF = {tubo:[0,108,0], placa1:[0,46,0], haste:[0,16,0], placa2:[0,46,0]};

// ================= ANIMAÇÃO
const anims = [];
function tween(d, fn){ d = Math.max(1, d*VEL); return new Promise(r=>anims.push({t0:performance.now(), d, fn, r})); }
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const espera = ms => tween(ms, ()=>{});
function mover(p, alvoP, alvoQ, d){
  const o = p.obj || p; const p0=o.position.clone(), q0=o.quaternion.clone();
  return tween(d, k=>{ if(alvoP) o.position.lerpVectors(p0,alvoP,k); if(alvoQ) o.quaternion.copy(q0).slerp(alvoQ,k); });
}
function camPara(pos, alvo, d){
  const p0=cam.position.clone(), a0=controles.target.clone();
  return tween(d, k=>{ cam.position.lerpVectors(p0,pos,k); controles.target.lerpVectors(a0,alvo,k); });
}

// ================= ETIQUETAS NA TELA
const camadaTags = $('#tags');
function novaTag(cls, txt){ const e=document.createElement('div'); e.className='tag '+cls; const t=document.createElement('span'); t.textContent=txt; e.appendChild(t); camadaTags.appendChild(e); return e; }
TODAS.forEach(p=>{ p.tag = novaTag('', NOMES[p.id]); });
const notas = []; // etiquetas presas a um ponto do mundo
function nota(txt, ponto, cls, ms){
  const e = novaTag(cls||'nota', txt); const n = {e, ponto, pai:null}; notas.push(n);
  if(ms) setTimeout(()=>tirarNota(n), ms*VEL);
  return n;
}
function tirarNota(n){ const i=notas.indexOf(n); if(i>=0){ notas.splice(i,1); n.e.remove(); } }
function limparNotas(){ while(notas.length) tirarNota(notas[0]); }
const tmp = V3(0,0,0);
function projetar(v, el){
  tmp.copy(v).project(cam);
  const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.2 && Math.abs(tmp.y) < 1.2;
  el.style.display = vis ? '' : 'none';
  if(vis) el.style.transform = `translate(${(tmp.x*.5+.5)*canvas.clientWidth}px,${(-tmp.y*.5+.5)*canvas.clientHeight}px) translate(-50%,-100%)`;
}
function atualizarTags(){
  TODAS.forEach(p=>{
    if(p.montado && !p.mostrarTag){ p.tag.style.display='none'; return; }
    p.obj.getWorldPosition(tmp);
    const o = TAG_OFF[p.id] || [0,24,0]; tmp.x+=o[0]; tmp.y+=o[1]; tmp.z+=o[2];
    projetar(tmp.clone(), p.tag);
  });
  notas.forEach(n=>{ const v = n.ponto.clone(); if(n.pai) n.pai.localToWorld(v); projetar(v, n.e); });
}

// ================= ETAPAS
const ETAPAS = [
  {id:'tubo', titulo:'Tubo Ø25', botao:'Posicionar o tubo',
   texto:'O tubo Ø25 é a coluna onde a cruzeta trabalha. Clique nele, ou no botão, para colocá-lo no lugar.',
   alvos:()=>[P.tubo],
   fazer:async()=>{ const h=P.tubo.home; await mover(P.tubo,V3(h.x-60,h.y+40,h.z+30),QI,750); await mover(P.tubo,h,null,650); }},
  {id:'placa1', titulo:'Placa #1 · 70 × 70 × 40', botao:'Descer a placa #1',

let etapa = 0, ocupado = false, auto = false, fim = false;

async function rosquear(b){
  const [ax,ay] = b.eixo;
  b.obj.rotation.set(0,0,0);
  await mover(b, V3(ax,ay,78), QI, 800);
  await mover(b, V3(ax,ay,40), null, 450);
  const contador = nota('volta 0 de 32', V3(ax,ay,46), 'nota');
  await tween(2200, (k,r)=>{ b.obj.position.z = 40 - (40-0.3125)*r; b.obj.rotation.z = -31.75*2*Math.PI*r;
    contador.e.firstChild.textContent = 'volta '+Math.min(32,Math.floor(r*31.75+0.25))+' de 32'; contador.ponto.z = b.obj.position.z+46; });
  tirarNota(contador);
}
const setas = [];
async function apertar(){
  await Promise.all(P.borbs.map(b=>tween(750,(k)=>{ b.obj.position.z = 0.3125*(1-k); b.obj.rotation.z = -(31.75+0.25*k)*2*Math.PI; })));
  P.borbs.forEach(b=>{ b.obj.rotation.z=0; b.obj.position.z=0;
    const s = new THREE.ArrowHelper(V3(0,0,-1), V3(b.eixo[0],b.eixo[1],58), 20, 0x2350a0, 7, 5); interno.add(s); setas.push(s);
    const n = nota('clic!', V3(b.eixo[0],b.eixo[1],40), 'clic'); n.pai = interno; setTimeout(()=>tirarNota(n),1200);
  });
  const n1 = nota('a fenda de 1,5 mm fecha e abraça o tubo', V3(36,-36,-23), 'nota'); n1.pai = interno;
  const n2 = nota('haste presa entre as duas calhas', V3(-92,10,1), 'nota'); n2.pai = interno;
  await espera(3200);
  tirarNota(n1); tirarNota(n2);
  setas.forEach(s=>interno.remove(s)); setas.length=0;
}
function legenda(t){ const e=$('#legenda'); e.hidden=!t; e.textContent=t||''; }
async function usoDiario(){
  const h2=P.placa2.home, hh=P.haste.home;
  legenda('1. Afrouxe cerca de 1 volta (1,25 mm)');
  await Promise.all([...P.borbs.map(b=>tween(1000,(k,r)=>{ b.obj.rotation.z = 2*Math.PI*k; b.obj.position.z = 1.25*k; })),
                     mover(P.placa2,V3(h2.x,h2.y,h2.z+1),null,1000)]);
  legenda('2. Deslize a haste até a medida');
  await mover(P.haste, V3(hh.x+38,hh.y,hh.z), null, 1400);
  legenda('3. Suba e gire a cruzeta no tubo');
  await tween(1600, k=>{ pivo.position.y = 32*k; pivo.rotation.y = 0.5*k; });
  legenda('4. Aperte de novo à mão');
  await Promise.all([...P.borbs.map(b=>tween(1000,(k)=>{ b.obj.rotation.z = 2*Math.PI*(1-k); b.obj.position.z = 1.25*(1-k); })),
                     mover(P.placa2,h2,null,1000)]);
  P.borbs.forEach(b=>b.obj.rotation.z=0);
  legenda('Travada na nova posição');
  await espera(1700);
  legenda('Voltando à posição de referência');
  await Promise.all([mover(P.haste,hh,null,1000), tween(1000,k=>{ pivo.position.y=32*(1-k); pivo.rotation.y=0.5*(1-k); })]);
  legenda('');
}

// ================= INTERFACE
const inv = $('#inv');
function desenharInventario(){
  const linhas = [
    ['Tubo Ø25',[P.tubo]], ['Placa #1 · 70×70×40',[P.placa1]], ['Haste Ø16,3',[P.haste]],
    ['Placa #2 · 70×70×18',[P.placa2]], ['Manípulo M8×60',P.borbs]];
  const alvoIds = fim||ocupado&&!ETAPAS[etapa]?.multi ? [] : (ETAPAS[etapa]?.alvos().map(p=>p.id) || []);
  inv.innerHTML = linhas.map(([n,ps])=>{
    const ok = ps.filter(p=>p.montado).length, tot=ps.length;
    const vez = etapa<5 && ps.some(p=>alvoIds.includes(p.id));
    return `<li class="${ok===tot?'ok':''} ${vez?'vez':''}"><span class="ck">${ok===tot?'✓':''}</span><span class="n">${n}</span><span class="q">${ok}/${tot}</span></li>`;
  }).join('');
}
function desenharCartao(){
  const passos = $('#passos'); passos.innerHTML = ETAPAS.map((e,i)=>`<i class="${i<etapa||fim?'ok':i===etapa?'vez':''}"></i>`).join('');
  const bA = $('#bAcao');
  if(fim){
    $('#eOlho').textContent = 'Conjunto montado';
    $('#eTitulo').textContent = 'Pronto: cruzeta montada e apertada';
    $('#eTexto').textContent = 'Gire a peça com o mouse para conferir. O desenho técnico tem as vistas, o corte e as medidas para imprimir.';
    bA.textContent = 'Abrir o desenho técnico'; bA.disabled=false; $('#bAuto').textContent='▶ Uso diário de novo';
  } else {
    const e = ETAPAS[etapa];
    $('#eOlho').textContent = `Etapa ${etapa+1} de ${ETAPAS.length}`;
    $('#eTitulo').textContent = e.titulo + (e.multi ? `  (${P.borbs.filter(b=>b.montado).length}/4)` : '');
    $('#eTexto').textContent = e.texto;
    bA.textContent = e.botao; bA.disabled = ocupado && !e.multi;
    $('#bAuto').textContent = auto ? '■ Parar' : '▶ Automático';
  }
  desenharInventario();
  const alvos = fim ? [] : ETAPAS[etapa].alvos();
  TODAS.forEach(p=>p.tag.classList.toggle('alvo', alvos.includes(p) && !p.montado));
}
function aviso(t){ const e=$('#aviso'); e.textContent=t; e.hidden=false; clearTimeout(aviso.t); aviso.t=setTimeout(()=>e.hidden=true,2200); }

async function executar(peca){
  if(fim) return;
  const e = ETAPAS[etapa];
  if(ocupado && !e.multi) return;
  if(e.multi){
    const b = peca || P.borbs.find(x=>!x.montado); if(!b || b.montado) return;
    ocupado = true; const pr = e.fazer(b); desenharCartao();
    await pr;
    if(P.borbs.some(x=>x.emAcao)) return;
    if(P.borbs.every(x=>x.montado)){ ocupado=false; avancar(); } else { ocupado=false; desenharCartao(); }
    return;
  }
  ocupado = true; desenharCartao();
  e.alvos().forEach(p=>p.montado=true);
  await e.fazer(peca);
  if(e.id==='placa2') await camPara(V3(170,95,320), V3(0,-38,-15), 1100);
  ocupado = false; avancar();
}
function avancar(){
  if(etapa < ETAPAS.length-1) etapa++; else fim = true;
  desenharCartao();
  if(auto) setTimeout(passoAuto, 500*VEL);
}
async function passoAuto(){
  if(!auto) return;
  if(fim){ auto=false; desenharCartao(); return; }
  const e = ETAPAS[etapa];
  if(e.multi){
    ocupado = true;
    for(let i=0;i<4;i++){ const b=P.borbs.find(x=>!x.montado); if(!b) break; const pr=e.fazer(b); desenharCartao(); await espera(650); if(i===3) await pr; }
    while(P.borbs.some(x=>x.emAcao)) await espera(100);
    ocupado=false; avancar(); return;
  }
  executar();
}

// clique nas peças
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let baixo = null;
function pecaSob(ev){
  const r = canvas.getBoundingClientRect();
  mouse.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse, cam);
  const h = ray.intersectObjects(meshes,false)[0];
  return h ? h.object.userData.peca : null;
}
canvas.addEventListener('pointerdown', ev=>{ baixo = [ev.clientX, ev.clientY]; });
canvas.addEventListener('pointerup', ev=>{
  if(!baixo || Math.hypot(ev.clientX-baixo[0], ev.clientY-baixo[1]) > 6 || auto) { baixo=null; return; }
  baixo = null;
  const p = pecaSob(ev); if(!p || fim) return;
  const e = ETAPAS[etapa];
  const alvos = e.alvos();
  if(alvos.includes(p)) executar(e.multi ? p : null);
  else if(!p.montado){
    const prox = alvos[0]; aviso(prox ? `Ainda não. Antes vem: ${NOMES[prox.id]}` : 'Use o botão do cartão');
    p.tag.classList.remove('treme'); void p.tag.offsetWidth; p.tag.classList.add('treme');
  }
});
let pendHover = null;
canvas.addEventListener('pointermove', ev=>{ pendHover = ev; });
function hover(){
  if(!pendHover) return; const ev = pendHover; pendHover = null;
  if(fim || auto){ canvas.style.cursor=''; return; }
  const p = pecaSob(ev);
  canvas.style.cursor = p && ETAPAS[etapa].alvos().includes(p) ? 'pointer' : '';
}

$('#bAcao').addEventListener('click', ()=>{ if(fim) abrirDesenho(); else executar(); });
$('#bAuto').addEventListener('click', ()=>{
  if(fim){ if(ocupado) return; ocupado=true; usoDiario().then(()=>{ ocupado=false; }); return; }
  auto = !auto; desenharCartao(); if(auto && !ocupado) passoAuto();
});
$('#bReset').addEventListener('click', recomecar);

function recomecar(){
  anims.length = 0; auto=false; ocupado=false; fim=false; etapa=0; legenda(''); limparNotas();
  setas.forEach(s=>interno.remove(s)); setas.length=0;
  pivo.position.set(0,0,-23); pivo.rotation.set(0,0,0);
  TODAS.forEach(p=>{ p.montado=false; p.emAcao=false; p.obj.position.copy(p.inicio.p); p.obj.quaternion.copy(p.inicio.q); });
  cam.position.set(310,150,600); controles.target.set(0,-48,-10); controles.update();
  desenharCartao();
}

// ================= LAÇO
function ajustar(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w,h,false); cam.aspect = w/h;
  cam.fov = cam.aspect < 1.25 ? Math.min(68, 34*1.25/cam.aspect) : 34;
  cam.updateProjectionMatrix();
}
addEventListener('resize', ajustar);
let t0 = performance.now();
function laco(now){
  requestAnimationFrame(laco);
  if(!$('#desenho').hidden) return; // desenho aberto: o 3D fica parado
  const lista = anims.slice();
  for(const a of lista){ const r = Math.min(1,(now-a.t0)/a.d); a.fn(ease(r), r); if(r>=1){ anims.splice(anims.indexOf(a),1); a.r(); } }
  const pulso = 0.5+0.5*Math.sin(now/260);
  const alvos = (fim||auto) ? [] : ETAPAS[etapa].alvos();
  TODAS.forEach(p=>{
    const marcado = alvos.includes(p) && !p.montado && !(ocupado && !ETAPAS[etapa].multi);
    p.mat.emissive.copy(COR_LAPIS).multiplyScalar(marcado ? 0.10+0.16*pulso : 0);
    p.arestas.material.color.setHex(marcado ? 0x2350a0 : 0x1d262b);
  });
  controles.update(); hover();
  efeito.render(cena, cam);
  atualizarTags();
}

// ================= DESENHO TÉCNICO (SVG, folha A2, escala 2:1)
function retratoPerspectiva(){
  const salvo = TODAS.map(p=>[p.obj.position.clone(), p.obj.quaternion.clone()]);
  const pv = [pivo.position.clone(), pivo.quaternion.clone()];
  TODAS.forEach(p=>{ p.obj.position.copy(p.home); p.obj.quaternion.identity(); p.mat.emissive.setScalar(0); p.arestas.material.color.setHex(0x1d262b); });
  pivo.position.set(0,0,-23); pivo.quaternion.identity();
  const W = 900;
  const r2 = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
  r2.setSize(W,W); r2.setClearColor(0x000000,0);
  const ef2 = new THREE.OutlineEffect(r2,{defaultThickness:0.004, defaultColor:[0.11,0.15,0.17]});
  const c2 = new THREE.PerspectiveCamera(26,1,1,3000); c2.position.set(330,240,420); c2.lookAt(0,-2,-12);
  ef2.render(cena, c2);
  const url = r2.domElement.toDataURL('image/png');
  r2.dispose();
  TODAS.forEach((p,i)=>{ p.obj.position.copy(salvo[i][0]); p.obj.quaternion.copy(salvo[i][1]); });
  pivo.position.copy(pv[0]); pivo.quaternion.copy(pv[1]);
  return url;

function folhaSVG(imgPerspectiva){
  const o = [];
  const n2 = v => Math.round(v*100)/100;
  const ln = (x1,y1,x2,y2,c) => o.push(`<line class="${c}" x1="${n2(x1)}" y1="${n2(y1)}" x2="${n2(x2)}" y2="${n2(y2)}"/>`);
  const rc = (x,y,w,h,c) => o.push(`<rect class="${c}" x="${n2(x)}" y="${n2(y)}" width="${n2(w)}" height="${n2(h)}"/>`);
  const ci = (x,y,r,c) => o.push(`<circle class="${c}" cx="${n2(x)}" cy="${n2(y)}" r="${n2(r)}"/>`);
  const tx = (x,y,s,c,a,rot) => o.push(`<text class="${c||'t'}" x="${n2(x)}" y="${n2(y)}" text-anchor="${a||'middle'}"${rot?` transform="rotate(${rot} ${n2(x)} ${n2(y)})"`:''}>${s}</text>`);
  const pa = (d,c,extra) => o.push(`<path class="${c}" d="${d}"${extra||''}/>`);
  function seta(x,y,ang){ const L=3.2,W=.95, bx=x-Math.cos(ang)*L, by=y-Math.sin(ang)*L, px=-Math.sin(ang)*W, py=Math.cos(ang)*W;
    o.push(`<path class="seta" d="M${n2(x)} ${n2(y)}L${n2(bx+px)} ${n2(by+py)}L${n2(bx-px)} ${n2(by-py)}Z"/>`); }
  // cota horizontal entre (x1,y1) e (x2,y2), linha de cota em yd
  function cotaH(x1,y1,x2,y2,yd,t,lado){
    [[x1,y1],[x2,y2]].forEach(([x,y])=>{ const s=Math.sign(yd-y)||1; ln(x,y+s*1,x,yd+s*2,'d'); });
    const a=Math.min(x1,x2), b=Math.max(x1,x2);
    if(b-a >= 13){ ln(a,yd,b,yd,'d'); seta(a,yd,Math.PI); seta(b,yd,0); tx((a+b)/2, yd-1.3, t); }
    else { ln(a-7,yd,b+7,yd,'d'); seta(a,yd,0); seta(b,yd,Math.PI);
      if(lado==='e') tx(a-8, yd-1.3, t, 't', 'end'); else tx(b+8, yd-1.3, t, 't', 'start'); }
  }
  function cotaV(x1,y1,x2,y2,xd,t){
    [[x1,y1],[x2,y2]].forEach(([x,y])=>{ const s=Math.sign(xd-x)||1; ln(x+s*1,y,xd+s*2,y,'d'); });
    const a=Math.min(y1,y2), b=Math.max(y1,y2);
    if(b-a >= 13){ ln(xd,a,xd,b,'d'); seta(xd,a,-Math.PI/2); seta(xd,b,Math.PI/2); tx(xd-1.3,(a+b)/2,t,'t','middle',-90); }
    else { ln(xd,a-7,xd,b+7,'d'); seta(xd,a,Math.PI/2); seta(xd,b,-Math.PI/2); tx(xd+2.2,(a+b)/2+1.5,t,'t','start'); }
  }
  // chamada com seta: ponta em (x,y), cotovelo em (x2,y2), texto para o lado "dir" (1 direita, -1 esquerda)
  function chamada(x,y,x2,y2,dir,linhas,cls){
    ln(x,y,x2,y2,'d'); seta(x,y,Math.atan2(y-y2,x-x2)); ln(x2,y2,x2+dir*5,y2,'d');
    linhas.forEach((s,i)=>tx(x2+dir*6, y2+1.4+i*5, s, cls||'t', dir>0?'start':'end'));
  }
  function rosca(x,y,rFuro,rRosca){ ci(x,y,rFuro,'v'); pa(`M${n2(x+rRosca)} ${n2(y)}A${rRosca} ${rRosca} 0 1 1 ${n2(x)} ${n2(y-rRosca)}`,'f'); }
  function cruz(x,y,m){ ln(x-m,y,x+m,y,'c'); ln(x,y-m,x,y+m,'c'); }

  o.push(`<defs>
    <pattern id="h1" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hl" x1="0" y1="0" x2="0" y2="2.6"/></pattern>
    <pattern id="h2" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line class="hl" x1="0" y1="0" x2="0" y2="2.6"/></pattern>
    <pattern id="h3" width="1.5" height="1.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hl" x1="0" y1="0" x2="0" y2="1.5"/></pattern>
    <pattern id="h4" width="1.3" height="1.3" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line class="hl" x1="0" y1="0" x2="0" y2="1.3"/></pattern>
  </defs>`);
  rc(0,0,594,420,'bco'); rc(10,10,574,400,'borda');

  // ---------- VISTA A: Placa #1 frontal (face da junta). Centro (115,128). 1 mm = 2 unidades
  {
    const cx=115, cy=128, X=v=>cx+v*2, Y=v=>cy-v*2;
    rc(X(-35),Y(35),140,140,'v');
    ln(X(-35),Y(8.09),X(35),Y(8.09),'v'); ln(X(-35),Y(-8.09),X(35),Y(-8.09),'v');           // bordas da calha
    ln(X(-12.575),Y(35),X(-12.575),Y(-35),'o'); ln(X(12.575),Y(35),X(12.575),Y(-35),'o');    // furo do tubo (oculto)
    [[-22,22],[-22,-22]].forEach(([u,v])=>rosca(X(u),Y(v),6.8,8));                            // M8 passante
    [[22,22],[22,-22]].forEach(([u,v])=>{ ci(X(u),Y(v),9,'v'); ci(X(u),Y(v),6.8,'f'); });     // lado da fenda: Ø9 + rosca atrás
    [22,-22].forEach(v=>ln(X(-38),Y(v),X(38),Y(v),'c')); [22,-22].forEach(u=>ln(X(u),Y(38),X(u),Y(-38),'c'));
    ln(X(-39),cy,X(39),cy,'c');
    // plano de corte A-A em x=0
    ln(cx,Y(37),cx,Y(-37),'c'); ln(cx,Y(35)-8,cx,Y(35)-2,'corte'); ln(cx,Y(-35)+2,cx,Y(-35)+8,'corte');
    [Y(35)-5,Y(-35)+5].forEach(y=>{ ln(cx,y,cx+8,y,'d'); seta(cx+9,y,0); tx(cx+12.5,y+1.6,'A','tv','start'); });
    cotaH(X(-35),Y(35),X(-22),Y(22),46,'13'); cotaH(X(-22),Y(22),X(22),Y(22),46,'44');
    cotaH(X(-35),Y(-35),X(35),Y(-35),215,'70');
    cotaV(X(-35),Y(35),X(-35),Y(-35),30,'70');
    cotaV(X(22),Y(22),X(22),Y(-22),198,'44');
    cotaV(X(35),Y(8.09),X(35),Y(-8.09),211,'16,18');
    chamada(X(-22)-3.4*Math.cos(1.05),Y(22)-6.8*Math.sin(1.05),60,34,-1,['2× M8×1,25 passante','(broca Ø6,8)']);
    chamada(X(22)+9*Math.cos(1.05),Y(22)-9*Math.sin(1.05),172,34,1,['2× Ø9 até a fenda','+ M8×1,25 na aba traseira (ver detalhe)']);
    tx(cx,227,'PLACA #1 · VISTA FRONTAL (face da junta)','tv');
  }
  // ---------- VISTA B: Placa #1 superior (1º diedro, abaixo da frontal). z=-40 em cima, face da junta (z=0) embaixo
  {
    const X=u=>115+u*2, Y=z=>245+(z+40)*2;
    rc(X(-35),Y(-40),140,80,'v');
    ci(X(0),Y(-23),25.15,'v');
    rc(X(12.575)-.7,Y(-23.75)+.35,1.6,2.3,'bco');
    ln(X(12.575),Y(-23.75),X(35),Y(-23.75),'v'); ln(X(12.575),Y(-22.25),X(35),Y(-22.25),'v'); // fenda
    ln(X(-35),Y(-7.15),X(35),Y(-7.15),'o');                                                  // fundo da calha
    [-22].forEach(u=>{ ln(X(u)-6.8,Y(-40),X(u)-6.8,Y(0),'o'); ln(X(u)+6.8,Y(-40),X(u)+6.8,Y(0),'o'); });
    ln(X(22)-6.8,Y(-40),X(22)-6.8,Y(-23.75),'o'); ln(X(22)+6.8,Y(-40),X(22)+6.8,Y(-23.75),'o'); // rosca na aba traseira
    ln(X(22)-9,Y(-22.25),X(22)-9,Y(0),'o'); ln(X(22)+9,Y(-22.25),X(22)+9,Y(0),'o');             // Ø9 na aba frontal
    cruz(X(0),Y(-23),30); [-22,22].forEach(u=>ln(X(u),Y(-40)-4,X(u),Y(0)+4,'c'));
    cotaV(X(-35),Y(-40),X(-35),Y(0),30,'40');
    cotaV(X(35),Y(-40),X(35),Y(-23.75),199,'16,25');
    cotaV(X(35),Y(-23.75),X(35),Y(-22.25),199,'1,5');
    cotaV(X(35),Y(-22.25),X(35),Y(0),199,'22,25');
    cotaV(X(0)+30,Y(-23),X(35),Y(0),214,'23');
    chamada(X(0)-25.15*Math.SQRT1_2,Y(-23)-25.15*Math.SQRT1_2,80,238,-1,['Ø25,15 +0,05/0']);
    chamada(X(-28),Y(-7.15),70,335,1,['calha R8,15 · prof. 7,15']);
    tx(115,346,'PLACA #1 · VISTA SUPERIOR','tv');
  }
  // ---------- CORTE A-A: conjunto, plano x=0, visto de -X. z na horizontal, y na vertical
  {
    const X=z=>268+(z+40)*2, Y=y=>128-y*2;
    const yA=Y(35), yB=Y(-35), ar=16.3, ycal=8.088*2;
    // placa 1: parede traseira e parte da frente (menos a calha)
    pa(`M${X(-40)} ${yA}H${n2(X(-35.575))}V${yB}H${X(-40)}Z`,'v',' style="fill:url(#h1)"');
    pa(`M${n2(X(-10.425))} ${yA}H${X(0)}V${n2(128-ycal)}A${ar} ${ar} 0 0 0 ${X(0)} ${n2(128+ycal)}V${yB}H${n2(X(-10.425))}Z`,'v',' style="fill:url(#h1)"');
    // placa 2
    pa(`M${X(2)} ${yA}H${X(20)}V${yB}H${X(2)}V${n2(128+ycal)}A${ar} ${ar} 0 0 0 ${X(2)} ${n2(128-ycal)}Z`,'v',' style="fill:url(#h2)"');
    // haste (corte transversal)
    o.push(`<circle class="v" cx="${X(1)}" cy="128" r="${ar}" style="fill:url(#h3)"/>`);
    // tubo oco Ø25 × 2 (corte longitudinal)
    const yt1=Y(38), yt2=Y(-38);
    pa(`M${X(-35.5)} ${yt1}H${X(-33.5)}V${yt2}H${X(-35.5)}Z`,'v',' style="fill:url(#h4)"');
    pa(`M${X(-12.5)} ${yt1}H${X(-10.5)}V${yt2}H${X(-12.5)}Z`,'v',' style="fill:url(#h4)"');
    [yt1,yt2].forEach(y=>{ const m=X(-23); pa(`M${X(-35.5)-2} ${y}H${m-3}L${m-1.5} ${y-2.5}L${m+1.5} ${y+2.5}L${m+3} ${y}H${X(-10.5)+2}`,'f'); });
    ln(X(-23),yt1-6,X(-23),yt2+6,'c'); cruz(X(1),128,21);
    cotaH(X(-40),yB,X(0),yB,214,'40'); cotaH(X(0),yB,X(2),yB,214,'2','e'); cotaH(X(2),yB,X(20),yB,214,'18');
    cotaH(X(-40),yB,X(20),yB,226,'60');
    cotaH(X(-23),yt1-6,X(0),yA,42,'23');
    cotaH(X(-35.5),yt1,X(-10.5),yt1,31,'Ø25 (tubo)');
    cotaV(X(20),yA,X(20),yB,400,'70');
    chamada(X(1)+ar*Math.cos(-1.05),128+ar*Math.sin(-1.05),378,50,1,['Ø16,3 (haste)']);
    tx(328,237,'CORTE A-A · CONJUNTO','tv');
  }
  // ---------- VISTA D: Placa #2 frontal (face externa)
  {
    const cx=495, cy=128, X=v=>cx+v*2, Y=v=>cy-v*2;
    rc(X(-35),Y(35),140,140,'v');
    ln(X(-35),Y(8.09),X(35),Y(8.09),'o'); ln(X(-35),Y(-8.09),X(35),Y(-8.09),'o');
    EIXOS.forEach(([u,v])=>ci(X(u),Y(v),9,'v'));
    [22,-22].forEach(v=>ln(X(-38),Y(v),X(38),Y(v),'c')); [22,-22].forEach(u=>ln(X(u),Y(38),X(u),Y(-38),'c'));
    ln(X(-39),cy,X(39),cy,'c'); ln(cx,Y(39),cx,Y(-39),'c');
    cotaH(X(-35),Y(35),X(-22),Y(22),46,'13'); cotaH(X(-22),Y(22),X(22),Y(22),46,'44');
    cotaH(X(-35),Y(-35),X(35),Y(-35),215,'70');
    cotaV(X(35),Y(35),X(35),Y(-35),577,'70');
    cotaV(X(22),Y(22),X(22),Y(-22),564,'44');
    chamada(X(22)+9*Math.cos(1.05),Y(22)-9*Math.sin(1.05),552,32,-1,['4× Ø9 passante']);
    tx(cx,227,'PLACA #2 · VISTA FRONTAL (calha oculta)','tv');
  }
  // ---------- perspectiva
  if(imgPerspectiva) o.push(`<image href="${imgPerspectiva}" x="226" y="236" width="104" height="104" preserveAspectRatio="xMidYMid meet"/>`);
  tx(278,346,'PERSPECTIVA (sem escala)','tv');

  // ---------- detalhe técnico do lado da fenda
  rc(336,244,244,40,'caixa');
  tx(341,252,'DETALHE · FUROS DO LADO DA FENDA (placa #1, 2 furos à direita)','tdh','start');
  ['Aba frontal (22,25): furo Ø9 passante, sem rosca.',
   'Aba traseira (16,25): rosca M8×1,25 passante.',
   'No aperto, a fenda de 1,5 mm fecha e prende o tubo Ø25.']
   .forEach((s,i)=>tx(341,260+i*7,s,'td','start'));

  // ---------- lista de peças
  {
    const x0=336, cols=[x0,348,476,556,580], y0=290, h=9.3;
    const rows=[['ITEM','DENOMINAÇÃO','MATERIAL','QTD'],
      ['1','Placa #1 · 70×70×40 · 4 furos M8','Al 6351-T6 ou aço 1020','1'],
      ['2','Placa #2 · 70×70×18 · 4× Ø9','Al 6351-T6 ou aço 1020','1'],
      ['3','Manípulo borboleta M8×60','Aço zincado','4'],
      ['4','Tubo Ø25 × 2 (existente)','—','1'],
      ['5','Haste Ø16,3 (existente)','—','1']];
    rc(x0,y0,244,h*rows.length,'v');
    rows.forEach((r,i)=>{ const y=y0+h*i; if(i) ln(x0,y,580,y,i===1?'v':'f');
      r.forEach((s,j)=>tx(j===1||j===2?cols[j]+2:(cols[j]+cols[j+1])/2, y+6.4, s, i?'ts':'tr', j===1||j===2?'start':'middle')); });
    cols.slice(1,4).forEach(x=>ln(x,y0,x,y0+h*rows.length,'f'));
  }
  // ---------- carimbo
  {
    const x0=336, y0=350;
    rc(x0,y0,244,58,'v'); ln(x0,y0+18,580,y0+18,'v'); ln(x0,y0+38,580,y0+38,'f');
    tx(x0+4,y0+13,'CRUZETA DE DUAS PLACAS','tb','start');
    tx(576,y0+6,'FOLHA','tr','end'); tx(576,y0+13,'1 / 1','t','end');
    const cel=(x,y,w,rot,val)=>{ ln(x+w,y,x+w,y+20,'f'); tx(x+2.5,y+5,rot,'tr','start'); tx(x+2.5,y+14,val,'t','start'); };
    let x=x0; [['ESCALA','2:1',40],['UNIDADE','mm',36],['PROJEÇÃO','1º diedro',52],['DATA','17/11/2026',56],['REVISÃO','A',60]]
      .forEach(([r,v,w],i,arr)=>{ if(i<arr.length-1) cel(x,y0+18,w,r,v); else { tx(x+2.5,y0+23,r,'tr','start'); tx(x+2.5,y0+32,v,'t','start'); } x+=w; });
    x=x0; [['MATERIAL','Al 6351-T6 ou aço SAE 1020',92],['TOLERÂNCIA GERAL','ABNT NBR ISO 2768-m',76],['EMPRESA','Uptec Brasil',76]]
      .forEach(([r,v,w],i,arr)=>{ if(i<arr.length-1){ ln(x+w,y0+38,x+w,y0+58,'f'); } tx(x+2.5,y0+43,r,'tr','start'); tx(x+2.5,y0+52.5,v,'t','start'); x+=w; });
  }
  // ---------- notas
  {
    const notasTx = [
      '1. Placas em alumínio 6351-T6 (anodizar) ou aço SAE 1020 (zincar ou oxidar preto e passar óleo).',
      '2. Chanfro 0,5 × 45° em todas as arestas externas.',
      '3. Calhas Ø16,30 +0,10/0 (R8,15): usinar com as placas montadas e calço de 2 mm entre elas.',
      '4. Folga de 2 mm entre as placas: é ela que garante o aperto. Paredes: tubo↔calha 3,3; traseira 4,4; sob a calha da placa #2: 10,85.',
      '5. Medir o tubo (Ø25) e a haste (Ø16,3) reais antes de usinar.',
      '6. Manípulos M8×60 apertados à mão; graxa leve na rosca. Em alumínio, roscas M8 com inserto helicoidal.',
      '7. Lado da fenda: rosca só na aba traseira (ver detalhe).'];
    tx(20,357,'NOTAS','tv','start');
    notasTx.forEach((s,i)=>tx(20,364+i*6.4,s,'ts','start'));
  }
  return `<svg id="folha" viewBox="0 0 594 420" width="594mm" height="420mm" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Desenho técnico da cruzeta de duas placas"><style>${ESTILO_FOLHA}</style>${o.join('')}</svg>`;
}

// ================= DOWNLOADS
let svgAtual = '';
async function baixar(nome, blob){
  let dl = null;
  try{ if(window.claude && window.claude.use) dl = await window.claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename:nome, data:blob}); aviso('Arquivo salvo: '+nome); }
    catch(e){ if(e && e.code==='declined') return; aviso('Não foi possível salvar ('+(e && e.code || 'erro')+')'); }
    return;
  }
  if(window.claude){ aviso('Download indisponível nesta visualização'); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function ocupar(btn, fn){
  if(btn.disabled) return; const txt = btn.textContent; btn.disabled = true; btn.textContent = 'Gerando…';
  try{ await fn(); } catch(e){ console.error(e); aviso('Erro ao gerar o arquivo'); }
  finally{ btn.disabled = false; btn.textContent = txt; }
}
function stlBinario(itens){
  let nt = 0; itens.forEach(i=>nt += i.g.attributes.position.count/3);
  const buf = new ArrayBuffer(84+50*nt), dv = new DataView(buf);
  const cab = 'Cruzeta de duas placas - Uptec Brasil - mm';
  for(let i=0;i<cab.length;i++) dv.setUint8(i, cab.charCodeAt(i));
  dv.setUint32(80, nt, true); let o = 84;
  itens.forEach(({g,off})=>{
    const p = g.attributes.position.array;
    for(let t=0;t<p.length;t+=9){
      const ax=p[t+3]-p[t],ay=p[t+4]-p[t+1],az=p[t+5]-p[t+2],bx=p[t+6]-p[t],by=p[t+7]-p[t+1],bz=p[t+8]-p[t+2];
      const nx=ay*bz-az*by, ny=az*bx-ax*bz, nz=ax*by-ay*bx, l=Math.hypot(nx,ny,nz)||1;
      dv.setFloat32(o,nx/l,true); dv.setFloat32(o+4,ny/l,true); dv.setFloat32(o+8,nz/l,true); o+=12;
      for(let k=0;k<9;k++){ dv.setFloat32(o, p[t+k]+off[k%3], true); o+=4; }
      o+=2;
    }
  });
  return buf;
}
const item = (p, off) => ({g:p.mesh.geometry, off: off || [p.home.x,p.home.y,p.home.z]});
async function baixar3D(){
  const zip = new JSZip();
  zip.file('conjunto_montado.stl', stlBinario([item(P.tubo),item(P.placa1),item(P.haste),item(P.placa2),...P.borbs.map(b=>item(b))]));
  zip.file('placa_1_70x70x40.stl', stlBinario([item(P.placa1)]));
  zip.file('placa_2_70x70x18.stl', stlBinario([item(P.placa2)]));
  zip.file('manipulo_borboleta_M8x60.stl', stlBinario([item(P.borbs[0],[0,0,0])]));
  zip.file('tubo_25.stl', stlBinario([item(P.tubo)]));
  zip.file('haste_16_3.stl', stlBinario([item(P.haste)]));
  zip.file('LEIA-ME.txt', [
    'Cruzeta de duas placas - Uptec Brasil',
    '',
    'Unidades: milimetros. Origem: centro da face da junta da placa #1.',
    'Eixo do tubo: X = 0, Z = -23. Eixo da haste: Y = 0, Z = +1.',
    'As pecas separadas ficam na mesma posicao do conjunto montado (exceto o manipulo, na origem).',
    '',
    'Os STL sao malhas para visualizacao e impressao 3D. Para usinar, use o desenho tecnico.',
    'Furos do lado da fenda: seguir o desenho (diametro 9 passante na aba frontal,',
    'rosca M8x1,25 so na aba traseira). Estes STL ainda trazem a rosca nas duas abas.'].join('\r\n'));
  const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:6}});
  await baixar('cruzeta_3D_STL.zip', blob);
}
function garantirFolha(){ if(!folhaPronta){ svgAtual = folhaSVG(retratoPerspectiva()); $('#mesa').innerHTML = svgAtual; folhaPronta = true; } }
async function folhaCanvas(pxPorMm){
  garantirFolha();
  const img = new Image(); const url = URL.createObjectURL(new Blob([svgAtual],{type:'image/svg+xml'}));
  img.src = url; await img.decode();
  const c = document.createElement('canvas'); c.width = Math.round(594*pxPorMm); c.height = Math.round(420*pxPorMm);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  return c;
}
const paraBlob = (c,tipo,q) => new Promise(r=>c.toBlob(r,tipo,q));
$('#bBaixar3D').addEventListener('click', e=>ocupar(e.currentTarget, baixar3D));
$('#bSVG').addEventListener('click', e=>ocupar(e.currentTarget, async()=>{ garantirFolha(); await baixar('cruzeta_desenho_tecnico.svg', new Blob([svgAtual],{type:'image/svg+xml'})); }));
$('#bPNG').addEventListener('click', e=>ocupar(e.currentTarget, async()=>{ const c = await folhaCanvas(8); await baixar('cruzeta_desenho_tecnico.png', await paraBlob(c,'image/png')); }));
$('#bPDF').addEventListener('click', e=>ocupar(e.currentTarget, async()=>{
  const c = await folhaCanvas(8);
  const pdf = new window.jspdf.jsPDF({orientation:'landscape', unit:'mm', format:'a2', compress:true});
  pdf.setProperties({title:'Cruzeta de duas placas - desenho tecnico', author:'Uptec Brasil'});
  pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,594,420);
  await baixar('cruzeta_desenho_tecnico_A2.pdf', pdf.output('blob'));
}));

let folhaPronta = false;
function abrirDesenho(){
  garantirFolha();
  $('#desenho').hidden = false;
}
$('#bDesenho').addEventListener('click', abrirDesenho);
$('#bVoltar').addEventListener('click', ()=>{ $('#desenho').hidden = true; });
$('#bZoom').addEventListener('click', ()=>{ const m=$('#mesa'); m.classList.toggle('real'); $('#bZoom').textContent = m.classList.contains('real') ? 'Ajustar à tela' : 'Ampliar'; });

// ================= INÍCIO
ajustar(); recomecar(); requestAnimationFrame(laco);
if(location.hash === '#desenho') abrirDesenho();
window.__cruzeta = {P, ETAPAS, executar, abrirDesenho, baixar3D, folhaCanvas, estado:()=>({etapa, fim, ocupado})};
})();
